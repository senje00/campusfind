<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin — CampusFind</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css"/>
</head>
<body>

  <nav class="navbar">
    <a href="../index.html" class="nav-brand" style="text-decoration:none;">
      <span class="brand-icon">◈</span>
      <span class="brand-name">CampusFind</span>
    </a>
    <div class="nav-links">
      <a href="../index.html" class="nav-link">Home</a>
      <a href="report.html" class="nav-link">Report Item</a>
      <a href="browse.html" class="nav-link">Browse</a>
      <a href="admin.html" class="nav-link active nav-admin">Admin</a>
    </div>
    <button class="nav-toggle" onclick="toggleNav()">☰</button>
  </nav>

  <!-- Admin Login Gate -->
  <div id="loginGate" style="max-width:400px;margin:5rem auto;padding:2rem;">
    <h1 class="page-title" style="margin-bottom:.5rem;">Admin Panel</h1>
    <p class="page-sub">Enter the admin PIN to continue.</p>
    <div class="form-card" style="margin-top:1.5rem;">
      <div class="form-group">
        <label>Admin PIN</label>
        <input type="password" id="pinInput" placeholder="Enter PIN (default: 1234)" onkeydown="if(event.key==='Enter') adminLogin()"/>
      </div>
      <div style="margin-top:1rem;">
        <button class="btn btn-primary" onclick="adminLogin()" style="width:100%;">Login</button>
      </div>
    </div>
  </div>

  <!-- Admin Dashboard -->
  <div id="adminDash" style="display:none; padding:3rem 4rem;">
    <div class="section-header">
      <div>
        <h1 class="page-title" style="margin-bottom:.25rem;">Admin Dashboard</h1>
        <p style="color:var(--text2);font-size:.9rem;">Manage all reported items</p>
      </div>
      <button class="btn btn-outline btn-sm" onclick="adminLogout()">Logout</button>
    </div>

    <!-- Summary cards -->
    <div class="admin-grid" id="adminStats"></div>

    <!-- Table -->
    <div style="margin-top:3rem;">
      <div class="section-header">
        <h2 class="section-title">All Items</h2>
        <button class="btn btn-danger btn-sm" onclick="clearAllItems()">🗑 Clear All Data</button>
      </div>
      <div style="overflow-x:auto;">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Title</th>
              <th>Type</th>
              <th>Category</th>
              <th>Location</th>
              <th>Date</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="adminTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/home.js"></script>
  <script src="../js/admin.js"></script>
  <script>requireAuth(); injectUserNav();</script>
</body>
</html>
